name: MobileWright checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      VORTEX_MOBILEWRIGHT_DIR: ${{ github.workspace }}/.vortex-ci
      VORTEX_PLAYWRIGHT: ${{ github.workspace }}/.vortex-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --prefix .vortex-ci --no-save @mobilewright/test@0.0.66
      - run: node .vortex-ci/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:integration
      - run: npm run package:windows
